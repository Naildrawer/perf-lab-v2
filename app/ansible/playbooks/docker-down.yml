---
- name: Stop Docker Compose mode
  hosts: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/../.."

  tasks:
    - name: Stop Docker Compose containers
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: "{{ project_dir }}"
      failed_when: false
      changed_when: true

    - name: Show remaining project containers
      ansible.builtin.command:
        cmd: docker ps --filter label=com.docker.compose.project=java-performance-demo --format 'table {{'{{'}}.Names{{'}}'}} {{'{{'}}.Status{{'}}'}}'
      changed_when: false
      failed_when: false
