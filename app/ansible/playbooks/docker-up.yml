---
- name: Start Docker Compose mode
  hosts: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/../.."

  tasks:
    - name: Stop k3s service before Docker mode
      become: true
      ansible.builtin.systemd:
        name: k3s
        state: stopped
        enabled: false
      failed_when: false
      changed_when: false

    - name: Kill k3s leftovers before Docker mode
      become: true
      ansible.builtin.command: /usr/local/bin/k3s-killall.sh
      failed_when: false
      changed_when: false

    - name: Wait until k3s is inactive
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_status
      retries: 20
      delay: 3
      until: k3s_status.stdout != "active" and k3s_status.stdout != "deactivating"
      failed_when: false
      changed_when: false

    - name: Stop old Docker Compose containers before clean Docker mode
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: "{{ project_dir }}"
      failed_when: false
      changed_when: false

    - name: Start Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}"
      environment:
        DOCKER_BUILDKIT: "1"
      changed_when: true

    - name: Wait for Docker application health endpoint
      ansible.builtin.uri:
        url: http://localhost:8088/actuator/health
        method: GET
        status_code: 200
        return_content: false
      register: docker_app_check
      retries: 40
      delay: 3
      until: docker_app_check.status == 200

    - name: Wait for Docker API 404 behavior
      ansible.builtin.uri:
        url: http://localhost:8088/users/999999999
        method: GET
        status_code: 404
        return_content: false
      register: docker_app_404_check
      retries: 10
      delay: 3
      until: docker_app_404_check.status == 404

    - name: Wait for Docker Prometheus
      ansible.builtin.uri:
        url: http://localhost:9090/-/ready
        method: GET
        status_code: 200
        return_content: false
      register: docker_prometheus_check
      retries: 40
      delay: 3
      until: docker_prometheus_check.status == 200

    - name: Wait for Docker Grafana
      ansible.builtin.uri:
        url: http://localhost:3000/api/health
        method: GET
        status_code: 200
        return_content: false
      register: docker_grafana_check
      retries: 40
      delay: 3
      until: docker_grafana_check.status == 200

    - name: Show Docker containers
      ansible.builtin.command:
        cmd: docker ps --format 'table {{'{{'}}.Names{{'}}'}} {{'{{'}}.Status{{'}}'}} {{'{{'}}.Ports{{'}}'}}'
      changed_when: false
