stages:
  - validate
  - build
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: "overlay2"
  APP_IMAGE: "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"
  APP_IMAGE_BRANCH: "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_REF_SLUG"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - app/.m2/repository

terraform:fmt:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  script:
    - terraform version
    - terraform fmt -recursive -check terraform/

terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  script:
    - terraform version
    - |
      cat > ~/.terraformrc <<'EOF'
      provider_installation {
        network_mirror {
          url     = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }

        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      EOF
    - cd terraform/environments/yandex
    - rm -rf .terraform .terraform.lock.hcl
    - terraform init -backend=false -upgrade
    - terraform validate
    - terraform providers

ansible:syntax:
  stage: validate
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir ansible
  script:
    - cd ansible
    - ansible-playbook --syntax-check playbooks/docker-up.yml
    - ansible-playbook --syntax-check playbooks/docker-down.yml
    - ansible-playbook --syntax-check playbooks/k8s-up.yml
    - ansible-playbook --syntax-check playbooks/k8s-down.yml
    - ansible-playbook --syntax-check playbooks/install-docker.yml
    - ansible-playbook --syntax-check playbooks/install-k3s.yml

k8s:manifests:kubeconform:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl tar
    - curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
    - mv kubeconform /usr/local/bin/
    - kubeconform -v
  script:
    - kubeconform -summary -verbose -strict -ignore-missing-schemas -kubernetes-version 1.31.0 k8s/*.yaml

spring:build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd app
    - mvn -B clean package -DskipTests
  artifacts:
    paths:
      - app/target/*.jar
    expire_in: 1 week

docker:compose:config:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  script:
    - docker version
    - docker compose -f docker-compose.yml config

docker:build:push:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  needs:
    - spring:build
  script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - DOCKER_BUILDKIT=1 docker build -t "$APP_IMAGE" -t "$APP_IMAGE_BRANCH" ./app
    - docker push "$APP_IMAGE"
    - docker push "$APP_IMAGE_BRANCH"

deploy:k8s:
  stage: deploy
  tags:
    - local-deploy
  needs:
    - docker:build:push
  environment:
    name: local-k3s
  before_script:
    - export KUBECONFIG=/home/gitlab-runner/.kube/config
    - kubectl version --client=true
    - |
      echo "Checking local k3s API..."
      if kubectl get nodes >/dev/null 2>&1; then
        echo "k3s API is already available"
      else
        echo "k3s API is unavailable. Trying to start k3s via systemd..."
        sudo -n systemctl start k3s
      fi
    - |
      for i in $(seq 1 60); do
        if kubectl get nodes >/dev/null 2>&1; then
          echo "k3s API is ready"
          kubectl get nodes -o wide
          break
        fi

        echo "Waiting for k3s API... ${i}/60"
        sleep 2
      done
    - kubectl get nodes -o wide
    - kubectl get namespace perf-lab >/dev/null 2>&1 || true
  script:
    - kubectl apply -f k8s/namespace.yaml
    - |
      REGISTRY_USERNAME="${REGISTRY_DEPLOY_USER:-$CI_REGISTRY_USER}"
      REGISTRY_PASSWORD_VALUE="${REGISTRY_DEPLOY_PASSWORD:-$CI_REGISTRY_PASSWORD}"

      kubectl -n perf-lab create secret docker-registry gitlab-registry \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$REGISTRY_USERNAME" \
        --docker-password="$REGISTRY_PASSWORD_VALUE" \
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl -n perf-lab patch serviceaccount default -p '{"imagePullSecrets":[{"name":"gitlab-registry"}]}' || true
    - kubectl apply -f k8s/postgres.yaml
    - kubectl apply -f k8s/redis.yaml
    - kubectl apply -f k8s/app.yaml
    - kubectl -n perf-lab set image deployment/app app="$APP_IMAGE"
    - kubectl apply -f k8s/postgres-exporter.yaml
    - kubectl apply -f k8s/redis-exporter.yaml
    - kubectl apply -f k8s/node-exporter.yaml
    - kubectl apply -f k8s/prometheus-rbac-service-view.yaml
    - kubectl apply -f k8s/prometheus-config.yaml
    - kubectl apply -f k8s/prometheus.yaml
    - kubectl apply -f k8s/grafana-datasources.yaml
    - kubectl apply -f k8s/grafana-dashboard-providers.yaml
    - kubectl apply -f k8s/grafana-dashboards.yaml
    - kubectl apply -f k8s/grafana.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl -n perf-lab rollout status deployment/app --timeout=180s
    - kubectl -n perf-lab rollout status deployment/postgres --timeout=180s
    - kubectl -n perf-lab rollout status deployment/redis --timeout=180s
    - kubectl -n perf-lab rollout status deployment/prometheus --timeout=180s
    - kubectl -n perf-lab rollout status deployment/grafana --timeout=180s
    - kubectl -n perf-lab get pods -o wide
    - kubectl -n perf-lab get svc -o wide
  rules:
    - if: '$CI_COMMIT_BRANCH == "perf-lab-dev"'
      when: manual
