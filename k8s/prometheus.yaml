
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: perf-lab

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: perf-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      securityContext:
        fsGroup: 65534

      initContainers:
        - name: fix-prometheus-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 65534:65534 /prometheus
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:latest

          securityContext:
            runAsUser: 65534
            runAsGroup: 65534

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true

            - name: prometheus-data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc

---

apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: perf-lab

spec:
  type: NodePort

  selector:
    app: prometheus

  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
