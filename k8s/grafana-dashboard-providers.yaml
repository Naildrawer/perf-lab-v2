apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: perf-lab

data:
  dashboard.yml: |-
    apiVersion: 1
    
    providers:
    
      - name: default
    
        orgID: 1
    
        folder: ""
    
        type: file
    
        disableDeletion: false
    
        editable: true
    
        updateIntervalSeconds: 10
    
        options:
    
          path: /var/lib/grafana/dashboards
