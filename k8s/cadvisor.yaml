apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: perf-lab
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: http
              containerPort: 8080
          args:
            - --housekeeping_interval=10s
            - --max_housekeeping_interval=15s
            - --docker_only=false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: containerd
              mountPath: /var/lib/containerd
              readOnly: true
            - name: k3s-containerd
              mountPath: /var/lib/rancher/k3s/agent/containerd
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: var-run
          hostPath:
            path: /var/run
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: containerd
          hostPath:
            path: /var/lib/containerd
            type: DirectoryOrCreate
        - name: k3s-containerd
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: perf-lab
spec:
  type: ClusterIP
  selector:
    app: cadvisor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
