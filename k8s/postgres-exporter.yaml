apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-exporter
  namespace: perf-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest

          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://app:app@postgres:5432/app?sslmode=disable"

          ports:
            - containerPort: 9187

---

apiVersion: v1
kind: Service

metadata:
  name: postgres-exporter
  namespace: perf-lab

spec:
  selector:
    app: postgres-exporter

  ports:
    - port: 9187
      targetPort: 9187

  type: ClusterIP
