apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: perf-lab

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: perf-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest

          ports:
            - containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin

          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana

            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning

            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards

      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc

        - name: grafana-provisioning
          hostPath:
            path: /home/admin/training/java-performance-demo/grafana/provisioning

        - name: grafana-dashboards
          hostPath:
            path: /home/admin/training/java-performance-demo/grafana/dashboards

---

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: perf-lab

spec:
  type: NodePort

  selector:
    app: grafana

  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
