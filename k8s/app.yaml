apiVersion: apps/v1
kind: Deployment

metadata:
  name: app
  namespace: perf-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: spring

  template:
    metadata:
      labels:
        app: spring

    spec:
      containers:
        - name: app

          image: docker.io/library/java-performance-demo-app:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/app

            - name: SPRING_DATASOURCE_USERNAME
              value: app

            - name: SPRING_DATASOURCE_PASSWORD
              value: app

            - name: SPRING_DATA_REDIS_HOST
              value: redis

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: SPRING_CACHE_TYPE
              value: redis

---

apiVersion: v1
kind: Service

metadata:
  name: app
  namespace: perf-lab

spec:
  selector:
    app: spring

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP

---

apiVersion: v1
kind: Service

metadata:
  name: app
  namespace: perf-lab

spec:
  type: NodePort

  selector:
    app: spring

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
