apiVersion: v1
kind: ServiceAccount

metadata:
  name: prometheus
  namespace: perf-lab

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: perf-lab-prometheus-discovery

rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch

  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs:
      - get

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: perf-lab-prometheus-discovery

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: perf-lab-prometheus-discovery

subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: perf-lab
