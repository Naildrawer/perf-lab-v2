apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: perf-lab
data:
  datasource.yml: |-
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
