---
- name: Stop Kubernetes mode
  hosts: local
  gather_facts: false

  tasks:
    - name: Stop k3s service
      ansible.builtin.command: sudo -n systemctl stop k3s
      failed_when: false
      changed_when: false

    - name: Kill k3s leftovers
      ansible.builtin.command: sudo -n /usr/local/bin/k3s-killall.sh
      failed_when: false
      changed_when: false

    - name: Check k3s status
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_status
      failed_when: false
      changed_when: false
