---
- name: Install k3s
  hosts: local
  gather_facts: false

  tasks:
    - name: Check k3s binary
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s if missing
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      when: not k3s_bin.stat.exists
      changed_when: true

    - name: Start k3s
      ansible.builtin.command: sudo -n systemctl start k3s
      changed_when: true

    - name: Wait for Kubernetes API
      ansible.builtin.command: kubectl get nodes
      register: kubectl_nodes
      retries: 30
      delay: 3
      until: kubectl_nodes.rc == 0
      changed_when: false

    - name: Check Kubernetes nodes
      ansible.builtin.command: kubectl get nodes
      changed_when: false
